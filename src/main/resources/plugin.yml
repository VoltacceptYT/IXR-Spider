name: spiderbot
version: '5.0-Release'
main: net.browselotus.spiderbot.SpiderAnimationPlugin
api-version: '1.21'

commands:
  items:
    description: Open the items menu (Robot Configuration tool)
    permission: spiderbot.items
  wheel:
    description: Spin the wheel for an item of value or an upgrade module
    permission: spiderbot.wheel

  spiderpack:
    description: Send or reload the Spiderbot resource pack
    usage: /<command> <send [player]|reload>
    permission: spiderbot.pack.admin

permissions:
  spiderbot.pack.admin:
    description: Allows /spiderpack
    default: op
  spiderbot.items:
    description: Allows access to the items command
    default: true
  spiderbot.wheel:
    description: Allows spinning the wheel (once every 6 hours)
    default: true
  spiderbot.wheel.owner:
    description: Owners can spin the wheel as often as they like
    default: op
