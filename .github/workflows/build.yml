name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # build.gradle.kts requires jvmToolchain(25); no toolchain
      # auto-provisioning plugin is configured, so we install it ourselves.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # This repo ships gradle/wrapper/gradle-wrapper.properties but not the
      # gradlew script/jar, so we can't run ./gradlew. This action installs
      # the exact Gradle version from that properties file and also handles
      # dependency caching for us.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Build plugin
        run: gradle build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: spiderbot-plugin
          path: build/libs/*.jar
          if-no-files-found: error
